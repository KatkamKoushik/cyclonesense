name: Multi-Job Hardened CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Frontend Verification: Static Quality, Unit Tests, and Production Build
  # ==========================================================================
  frontend-checks:
    name: Frontend Unit & Static Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Verify dependency security (pnpm audit)
        working-directory: frontend
        run: pnpm audit --audit-level=high

      - name: Run frontend linter (ESLint)
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build frontend application (Next.js & TypeScript)
        working-directory: frontend
        run: pnpm build

  # ==========================================================================
  # 2. Frontend End-to-End Playwright Suite
  # ==========================================================================
  frontend-e2e-playwright:
    name: Frontend E2E Playwright Suite
    runs-on: ubuntu-latest
    needs: frontend-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Install Playwright Chromium Browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend for production E2E
        working-directory: frontend
        run: pnpm build

      - name: Run Playwright E2E Tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================================================
  # 3. Rust Scientific Core: Compilation & Unit Tests
  # ==========================================================================
  rust-core-verification:
    name: Rust Scientific Core (cyclonesense_core)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-work-spaces: 'crates/cyclonesense_core'

      - name: Check Rust Core compilation
        working-directory: crates/cyclonesense_core
        run: cargo check --verbose

      - name: Run Rust Core Unit Tests
        working-directory: crates/cyclonesense_core
        run: cargo test --verbose

  # ==========================================================================
  # 4. Backend Supply Chain & Security Audit
  # ==========================================================================
  backend-security-audit:
    name: Backend Supply Chain Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r backend/requirements.txt

      - name: Verify Python dependency security (pip-audit)
        run: pip-audit -r backend/requirements.txt

  # ==========================================================================
  # 5. Backend Scientific Verification Suite (76 Tests)
  # ==========================================================================
  backend-scientific-suite:
    name: Backend Scientific Verification Suite
    runs-on: ubuntu-latest
    needs: [rust-core-verification, backend-security-audit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies & maturin
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install maturin

      - name: Build & Install Rust Core Wheel
        working-directory: crates/cyclonesense_core
        run: |
          maturin build --release
          pip install target/wheels/*.whl

      - name: Run Scientific Verification Test Suite
        run: |
          python -m pytest backend/tests -m "not playwright" --ignore=backend/tests/test_hardening_stress.py --ignore=backend/tests/test_ui_playwright.py -v

  # ==========================================================================
  # 6. Concurrency, Hardening & Stress Suite
  # ==========================================================================
  backend-hardening-and-stress:
    name: Concurrency & Stress Hardening Tests
    runs-on: ubuntu-latest
    needs: backend-scientific-suite
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies & maturin
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install maturin

      - name: Build & Install Rust Core Wheel
        working-directory: crates/cyclonesense_core
        run: |
          maturin build --release
          pip install target/wheels/*.whl

      - name: Run Concurrency, Stress & Security Hardening Tests
        run: |
          python -m pytest backend/tests/test_hardening_stress.py -v
