[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .. .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    portable: Fast self-contained unit tests running on synthetic/in-memory data
    heavyweight: Tests requiring external network calls or large (>1MB) satellite NetCDF granules
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning

